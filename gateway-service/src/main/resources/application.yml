server:
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
    gateway:
      routes:
        - id: member
          uri: lb://member-service
          predicates:
            - Path=/api/auth/**
        - id: catalog
          uri: lb://catalog-service
          predicates:
            - Path=/api/products,/api/products/**,/api/pickup-points,/api/pickup-points/**,/api/admin/products,/api/admin/products/**
        - id: order
          uri: lb://order-service
          predicates:
            - Path=/api/orders,/api/orders/**,/api/admin/orders,/api/admin/orders/**,/api/admin/pickups,/api/admin/pickups/**
app:
  jwt-secret: ${APP_JWT_SECRET:local-study-secret-change-before-sharing}
